title: "LourahJS Documentation"
description: "Official documentation for the LourahJS JavaScript framework"
theme: "just-the-docs"

nav_sort: case_sensitive
baseurl: ""

color_scheme: auto

search_enabled: true
search:
  heading_level: 2
  previews: 3
  tokenizer_separator: /[\s/]+/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - "README.md"
  - "node_modules/"
  - "package.json"
  - "package-lock.json"

# ------------------------------------------------------------
# Just the Docs — Collections (CRITICAL)
# ------------------------------------------------------------
collections:
  lourahjs:
    output: true
    permalink: /:collection/:path/

just_the_docs:
  collections:
    lourahjs:
      name: "LourahJS"
      output: true

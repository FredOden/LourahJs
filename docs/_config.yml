# ============================================================
#  LourahJS Documentation — Just the Docs configuration
#  Place this file in: docs/_config.yml
# ============================================================

title: "LourahJS Documentation"
description: "Official documentation for the LourahJS JavaScript framework"
theme: "just-the-docs"

# ------------------------------------------------------------
# Navigation
# ------------------------------------------------------------
# Enables the left sidebar navigation
# Pages define their own order using `nav_order`
# ------------------------------------------------------------
nav_sort: case_sensitive

# ------------------------------------------------------------
# Base URL (GitHub Pages)
# ------------------------------------------------------------
# If your repo is: https://github.com/<user>/<repo>
# And docs are in /docs, GitHub Pages automatically serves them.
# Leave baseurl empty.
# ------------------------------------------------------------
baseurl: ""

# ------------------------------------------------------------
# Logo (optional)
# Add your logo in docs/assets/images/logo.png
# ------------------------------------------------------------
# logo: "/assets/images/logo.png"

# ------------------------------------------------------------
# Color scheme
# Options: light, dark, auto
# ------------------------------------------------------------
color_scheme: auto

# ------------------------------------------------------------
# Search
# ------------------------------------------------------------
search_enabled: true
search:
  heading_level: 2
  previews: 3
  tokenizer_separator: /[\s/]+/

# ------------------------------------------------------------
# Markdown options
# ------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# ------------------------------------------------------------
# Exclusions
# ------------------------------------------------------------
exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - "README.md"
  - "node_modules/"
  - "package.json"
  - "package-lock.json"

# ------------------------------------------------------------
# Collections (optional future modules)
# ------------------------------------------------------------
# collections:
#   lourahjs:
#     output: true
#     permalink: /:collection/:path/
